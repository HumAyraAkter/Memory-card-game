<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Card Game</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* FULL SCREEN BACKGROUND */
body {
  height: 100vh;
  background: linear-gradient(135deg, #FF8AD8, #73D8FF);
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;

  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  color: #333;

  overflow: hidden; /* FIX WIDTH SHIFT */
}

h1 {
  margin-top: 10px;
  font-weight: bold;
}

.info {
  font-size: 18px;
  margin-top: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 400px;
  margin: 35px auto;
  height: 400px;
}

.card {
  perspective: 1000px;
  height: 100px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s;
  transform-style: preserve-3d;
  cursor: pointer;
}

.card.flip .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2rem;
  backface-visibility: hidden;
}

.card-front {
  background: white;
  transform: rotateY(180deg);
}

.card-back {
  background: #FF8AD8;
  color: white;
}

/* WIN POPUP FIXED */
#winPopup {
  position: fixed;
  inset: 0; /* FULL SCREEN */
  width: 100%;
  height: 100%;
  display: none;

  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.6);
  z-index: 1000;
}

.popup-content {
  background: #73d7ffc9;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  animation: pop 0.4s ease;

  max-width: 90%;
}

@keyframes pop {
  0% {transform: scale(0.6); opacity:0;}
  100% {transform: scale(1); opacity:1;}
}

/* Balloons */
.balloon {
  position: absolute;
  bottom: -100px;
  font-size: 2rem;
  animation: float 5s linear forwards;
}

@keyframes float {
  from {transform: translateY(0);}
  to {transform: translateY(-110vh);}
}

@media(max-width:576px){
  .card { height: 70px; }

  .grid {
    max-width: 340px;
    padding: 10px;
    gap: 10px;
  }
}

.heart-line1, .heart-line2 {
  height: 80px;
  overflow: hidden;
  font-size: 2rem;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<div class="heart-line1">❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️</div>

<div class="container">
  <h1>Memory Card Game 💖</h1>

  <div class="info">
    Moves: <span id="moves">0</span> | 
    Time: <span id="time">120</span>s
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="heart-line2">❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️</div>

<!-- WIN POPUP -->
<div id="winPopup">
  <div class="popup-content">
    <h2>🎉 Congratulations! 🎉</h2>
    <p>You won the game!</p>
    <button class="btn btn-primary" onclick="location.reload()" 
    style="background-color: #FF8AD8; color: black; padding: 5px; border-radius: 10px;">
      Play Again
    </button>
  </div>
</div>

<script>
const emojis = ['🍎','🍌','🍇','🍉','🍒','🥝','🍍','🥥'];
let cards = [...emojis, ...emojis];
let flipped = [];
let lock = false;
let moves = 0;
let matched = 0;

let timeLeft = 120;
const timerEl = document.getElementById("time");

const grid = document.getElementById("grid");

// TIMER
const timer = setInterval(() => {
  timeLeft--;
  timerEl.textContent = timeLeft;

  if (timeLeft <= 0) {
    clearInterval(timer);
    alert("⏰ Time's up!");
    location.reload();
  }
}, 1000);

// Shuffle
cards.sort(() => 0.5 - Math.random());

// Create cards
cards.forEach(e => {
  const card = document.createElement("div");
  card.classList.add("card");

  card.innerHTML = `
    <div class="card-inner">
      <div class="card-front">${e}</div>
      <div class="card-back">?</div>
    </div>
  `;

  card.dataset.emoji = e;
  card.onclick = flipCard;

  grid.appendChild(card);
});

function flipCard() {
  if (lock || this.classList.contains("flip")) return;

  this.classList.add("flip");
  flipped.push(this);

  if (flipped.length === 2) {
    moves++;
    document.getElementById("moves").textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;

  if (a.dataset.emoji === b.dataset.emoji) {
    matched++;
    flipped = [];

    if (matched === 8) {
      clearInterval(timer);
      showWin();
    }

  } else {
    lock = true;
    setTimeout(() => {
      a.classList.remove("flip");
      b.classList.remove("flip");
      flipped = [];
      lock = false;
    }, 700);
  }
}

function showWin() {
  const popup = document.getElementById("winPopup");
  popup.style.display = "flex";

  // lock scroll properly
  document.body.style.overflow = "hidden";

  // Balloons
  for (let i = 0; i < 20; i++) {
    let b = document.createElement("div");
    b.classList.add("balloon");
    b.style.left = Math.random() * 100 + "%";
    b.style.animationDuration = (3 + Math.random() * 3) + "s";
    b.innerHTML = "🎈";
    document.body.appendChild(b);
  }
}
</script>

</body>
</html>
